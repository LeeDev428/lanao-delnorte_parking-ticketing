name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, sqlite3, dom, filter, gd, json, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Run tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: ./vendor/bin/pest

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST || secrets.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME || secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ vars.SSH_PORT || secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            REPO_URL="https://github.com/LeeDev428/lanao-delnorte_parking-ticketing.git"
            REPO_DIR="${{ vars.DEPLOY_REPO_DIR || secrets.DEPLOY_REPO_DIR }}"
            WEBROOT_DIR="${{ vars.DEPLOY_WEBROOT_DIR || secrets.DEPLOY_WEBROOT_DIR }}"
            APP_URL="${{ vars.APP_URL || secrets.APP_URL }}"
            DEPLOY_DOMAIN="${{ vars.DEPLOY_DOMAIN || secrets.DEPLOY_DOMAIN }}"

            HOME_DIR="$(cd ~ && pwd)"
            [ -n "$DEPLOY_DOMAIN" ] || DEPLOY_DOMAIN="dkrsolutions.co"

            # Safe defaults for the current production host.
            [ -n "$REPO_DIR" ] || REPO_DIR="$HOME_DIR/domains/$DEPLOY_DOMAIN/parking-ticketing"
            [ -n "$WEBROOT_DIR" ] || WEBROOT_DIR="$HOME_DIR/domains/$DEPLOY_DOMAIN/public_html"
            [ -n "$APP_URL" ] || APP_URL="https://dkrsolutions.co"

            if [ -z "$REPO_DIR" ] || [ -z "$WEBROOT_DIR" ]; then
              echo "Missing deploy paths. Set DEPLOY_REPO_DIR and DEPLOY_WEBROOT_DIR as repository Secrets or Variables."
              exit 1
            fi

            REPO_PUBLIC_DIR="$REPO_DIR/public"
            REPO_BASENAME="$(basename "$REPO_DIR")"

            echo "Deploy user: $(whoami)"
            echo "Deploy host: $(hostname)"
            echo "Home dir: $HOME_DIR"
            echo "Using REPO_DIR=$REPO_DIR"
            echo "Using WEBROOT_DIR=$WEBROOT_DIR"

            mkdir -p "$REPO_DIR"

            if [ ! -w "$REPO_DIR" ]; then
              echo "No write permission for REPO_DIR: $REPO_DIR"
              echo "Check SSH_HOST/SSH_USERNAME target or choose a writable DEPLOY_REPO_DIR."
              exit 1
            fi

            cd "$REPO_DIR"

            if [ ! -d .git ]; then
              git init
              git remote add origin "$REPO_URL"
            else
              git remote set-url origin "$REPO_URL" || true
            fi

            git fetch --all --prune
            git reset --hard origin/master

            composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

            if command -v npm >/dev/null 2>&1; then
              npm ci
              npm run build
            else
              echo "npm is not available on server; using committed public/build artifacts"
            fi

            if [ ! -f .env ]; then
              cp .env.example .env
              php artisan key:generate --force
            fi

            if grep -q '^APP_URL=' .env; then
              sed -i "s|^APP_URL=.*|APP_URL=$APP_URL|" .env
            else
              echo "APP_URL=$APP_URL" >> .env
            fi

            php artisan migrate --force

            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            chmod -R 775 storage bootstrap/cache

            if [ ! -d "$WEBROOT_DIR" ] || [ ! -w "$WEBROOT_DIR" ]; then
              echo "WEBROOT_DIR is missing or not writable: $WEBROOT_DIR"
              for CANDIDATE in "$HOME_DIR/public_html" "$REPO_PUBLIC_DIR"; do
                if [ -d "$CANDIDATE" ] && [ -w "$CANDIDATE" ]; then
                  WEBROOT_DIR="$CANDIDATE"
                  echo "Using fallback WEBROOT_DIR=$WEBROOT_DIR"
                  break
                fi
              done
            fi

            if [ ! -d "$WEBROOT_DIR" ] || [ ! -w "$WEBROOT_DIR" ]; then
              echo "No writable webroot found. Checked: configured WEBROOT_DIR, $HOME_DIR/public_html, and $REPO_PUBLIC_DIR"
              exit 1
            fi

            if [ "$WEBROOT_DIR" = "$REPO_PUBLIC_DIR" ]; then
              echo "WEBROOT_DIR matches repo public directory; skipping rsync/index.php rewrite"
            else
              rsync -a --delete "$REPO_PUBLIC_DIR/" "$WEBROOT_DIR/"
              sed -i "s|__DIR__.'/../vendor/autoload.php'|__DIR__.'/../$REPO_BASENAME/vendor/autoload.php'|" "$WEBROOT_DIR/index.php"
              sed -i "s|__DIR__.'/../bootstrap/app.php'|__DIR__.'/../$REPO_BASENAME/bootstrap/app.php'|" "$WEBROOT_DIR/index.php"
            fi

            # Hostinger shell may restrict exec()/symlink operations.
            php artisan storage:link || true

            echo "Deployment completed successfully"

      - name: Deployment Success Notification
        if: success()
        run: echo "Deployment to Hostinger completed successfully"

      - name: Deployment Failure Notification
        if: failure()
        run: echo "Deployment failed. Check logs for details"
