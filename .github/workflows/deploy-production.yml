name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, pdo_sqlite, sqlite3, dom, filter, gd, json, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Run tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: ./vendor/bin/pest

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: false
          script: |
            echo "[1/8] Identifying environment"
            HOME_DIR="$(cd ~ && pwd)"
            REPO_DIR="$HOME_DIR/domains/dkrsolutions.co/parking-ticketing"
            WEBROOT_DIR="$HOME_DIR/domains/dkrsolutions.co/public_html"
            echo "  home=$HOME_DIR repo=$REPO_DIR webroot=$WEBROOT_DIR"

            echo "[2/8] Updating code from git"
            cd "$REPO_DIR" || { echo "ERROR: cannot cd to $REPO_DIR"; exit 1; }
            git fetch origin master 2>&1
            git reset --hard origin/master 2>&1

            echo "[3/8] Installing PHP dependencies"
            composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-scripts 2>&1

            echo "[4/8] Bootstrapping Laravel"
            php artisan package:discover --ansi 2>&1 || echo "package:discover warning (non-fatal)"

            echo "[5/8] Running migrations and seeder"
            php artisan migrate --force 2>&1
            php artisan db:seed --force 2>&1 || echo "Seeder warning (non-fatal)"

            echo "[6/8] Clearing and rebuilding caches"
            php artisan optimize:clear 2>&1
            php artisan config:cache 2>&1
            php artisan route:cache 2>&1
            php artisan view:cache 2>&1

            echo "[7/8] Fixing storage permissions"
            chmod -R 775 storage bootstrap/cache 2>&1

            echo "[8/8] Syncing public assets to webroot"
            if [ -d "$WEBROOT_DIR" ] && [ -w "$WEBROOT_DIR" ]; then
              cp -rf "$REPO_DIR/public/build" "$WEBROOT_DIR/" 2>&1 || echo "Assets copy warning (non-fatal)"
              echo "  Assets synced to $WEBROOT_DIR/build"
            else
              echo "  Note: $WEBROOT_DIR not writable — assets not synced (use manual sync if needed)"
            fi

            echo "=== Deployment completed ==="

      - name: Deployment Success Notification
        if: success()
        run: echo "Deployment to Hostinger completed successfully"

      - name: Deployment Failure Notification
        if: failure()
        run: echo "Deployment failed. Check logs for details"
