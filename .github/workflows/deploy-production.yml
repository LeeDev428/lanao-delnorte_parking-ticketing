name: Deploy to Production (Hostinger)

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Run tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: ./vendor/bin/pest

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            REPO_URL="https://github.com/LeeDev428/lanao-delnorte_parking-ticketing.git"
            REPO_DIR="${{ secrets.DEPLOY_REPO_DIR }}"
            WEBROOT_DIR="${{ secrets.DEPLOY_WEBROOT_DIR }}"
            REPO_PUBLIC_DIR="$REPO_DIR/public"

            if [ ! -d "$REPO_DIR/.git" ]; then
              rm -rf "$REPO_DIR"
              git clone "$REPO_URL" "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            git fetch --all --prune
            git reset --hard origin/master

            composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

            if command -v npm >/dev/null 2>&1; then
              npm ci
              npm run build
            else
              echo "npm is not available on server; using committed public/build artifacts"
            fi

            if [ ! -f .env ]; then
              cp .env.example .env
              php artisan key:generate --force
            fi

            sed -i 's|^APP_URL=.*|APP_URL=${{ secrets.APP_URL }}|' .env

            php artisan migrate --force

            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            chmod -R 775 storage bootstrap/cache

            rsync -a --delete "$REPO_PUBLIC_DIR/" "$WEBROOT_DIR/"
            sed -i "s|__DIR__.'/../vendor/autoload.php'|__DIR__.'/../parking-ticketing/vendor/autoload.php'|" "$WEBROOT_DIR/index.php"
            sed -i "s|__DIR__.'/../bootstrap/app.php'|__DIR__.'/../parking-ticketing/bootstrap/app.php'|" "$WEBROOT_DIR/index.php"

            # Hostinger shell may restrict exec()/symlink operations.
            php artisan storage:link || true

            echo "Deployment completed successfully"

      - name: Deployment Success Notification
        if: success()
        run: echo "Deployment to Hostinger completed successfully"

      - name: Deployment Failure Notification
        if: failure()
        run: echo "Deployment failed. Check logs for details"
